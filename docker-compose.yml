version: '3.9'

services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vault-server
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      DB_PATH: /data/vault.db
      NODE_ENV: production
    volumes:
      - vault_data:/data
    networks:
      - vault
    expose:
      - "4000"
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://yourdomain.com/api}
        VITE_WS_URL:  ${VITE_WS_URL:-wss://yourdomain.com/ws}
    container_name: vault-client
    restart: unless-stopped
    networks:
      - vault
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: vault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - vault
    depends_on:
      - client
      - server

  certbot:
    image: certbot/certbot:latest
    container_name: vault-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles: ["ssl"]
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
        --email $${CERT_EMAIL} -d $${DOMAIN}
        --agree-tos --no-eff-email --force-renewal"

volumes:
  vault_data:
  certbot_www:

networks:
  vault:
    driver: bridge
