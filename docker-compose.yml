version: '3.9'

# vault.msg — Production Docker Compose
# Run: docker compose --env-file .env up -d

services:

  # ── Backend API + WebSocket ─────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vault-server
    restart: unless-stopped
    environment:
      NODE_ENV:              production
      PORT:                  4000
      ALLOWED_ORIGIN:        ${ALLOWED_ORIGIN}
      JWT_SECRET:            ${JWT_SECRET}
      JWT_REFRESH_SECRET:    ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_EXPIRY:   15m
      DB_PATH:               /data/vault.db
      RATE_LIMIT_MAX:        100
      AUTH_RATE_LIMIT_MAX:   10
      RATE_LIMIT_WINDOW_MS:  900000
    volumes:
      - vault_data:/data
    networks:
      - internal
    expose:
      - "4000"           # NOT published externally — nginx proxies to it
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend + Nginx (TLS termination + reverse proxy) ──────────────────
  nginx:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL:  ${VITE_API_URL}
        VITE_WS_URL:   ${VITE_WS_URL}
    container_name: vault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      server:
        condition: service_healthy

  # ── Certbot (Let's Encrypt SSL — run once to issue, then renews) ────────
  certbot:
    image: certbot/certbot:latest
    container_name: vault-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "
        certbot certonly --webroot -w /var/www/certbot
          --email ${CERT_EMAIL}
          -d ${DOMAIN}
          --agree-tos --no-eff-email --force-renewal
      "
    profiles:
      - ssl   # only runs when: docker compose --profile ssl up certbot

volumes:
  vault_data:       # SQLite DB — persists across container restarts
  certbot_www:      # ACME challenge webroot

networks:
  internal:
    driver: bridge
